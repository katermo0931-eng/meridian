<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meridian — Snapshot</title>
  <style>
/* ── Reset & Base ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

html {
  overflow-x: hidden;
  max-width: 100vw;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  background: #0f172a;   /* slate-900 */
  color: #cbd5e1;         /* slate-300 */
  overflow-x: hidden;
  max-width: 100vw;
}

/* ── Header ───────────────────────────────────────── */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  background: #1e293b;   /* slate-800 */
  border-bottom: 1px solid #334155;  /* slate-700 */
}

h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: #f1f5f9;         /* slate-100 */
}

.meta {
  margin-top: 4px;
  font-size: 12px;
  color: #475569;         /* slate-600 */
  line-height: 1.4;
}

/* ── Controls ─────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.controls input,
.controls select,
.controls button {
  font-size: 13px;
  font-family: inherit;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #cbd5e1;
}

.controls input { width: 240px; }
.controls input::placeholder { color: #475569; }

.controls select option { background: #1e293b; }

.controls button {
  background: #1e3a5f;
  color: #93c5fd;
  border-color: #2563eb;
  cursor: pointer;
  font-weight: 600;
}
.controls button:hover { background: #1d4ed8; color: #fff; }

.countdown {
  font-size: 12px;
  color: #475569;
  min-width: 64px;
}

/* ── Root bar ─────────────────────────────────────── */
.root-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 24px;
  background: #1e293b;
  border-bottom: 1px solid #334155;
  font-size: 12px;
}

.root-bar label {
  color: #475569;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.root-input {
  font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #cbd5e1;
  width: 380px;
}
.root-input::placeholder { color: #334155; }
.root-input:focus { outline: none; border-color: #3b82f6; }

.root-bar button {
  font-size: 12px;
  font-family: inherit;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #2563eb;
  background: #1e3a5f;
  color: #93c5fd;
  cursor: pointer;
  font-weight: 600;
}
.root-bar button:hover { background: #1d4ed8; color: #fff; }

/* ── Main / Table ─────────────────────────────────── */
main { padding: 16px 24px; }

/* ── Table scroll wrapper ─────────────────────────── */
.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 12px;
}

table {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid #1e293b;
  vertical-align: top;
  overflow-wrap: anywhere;
  font-size: 13px;
}

th {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #475569;
  background: #0f172a;
  border-bottom: 1px solid #334155;
}

tr:last-child td { border-bottom: none; }

/* ── Project cell ─────────────────────────────────── */
.proj .title  { font-weight: 600; color: #f1f5f9; }
.proj .folder { font-size: 12px; color: #475569; margin-top: 3px; }

/* ── Status badges ────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge.ok       { background: rgba(74,222,128,.1);  color: #4ade80; border-color: rgba(74,222,128,.25); }
.badge.warn     { background: rgba(251,191,36,.1);  color: #fbbf24; border-color: rgba(251,191,36,.25); }
.badge.blocked  { background: rgba(248,113,113,.1); color: #f87171; border-color: rgba(248,113,113,.25); }
.badge.info     { background: rgba(96,165,250,.1);  color: #60a5fa; border-color: rgba(96,165,250,.25); }

/* ── Numbers ──────────────────────────────────────── */
td.num { color: #94a3b8; }

/* ── Progress bar ─────────────────────────────────── */
.prog-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.prog-bar {
  flex: 1;
  height: 5px;
  background: #334155;
  border-radius: 999px;
  overflow: hidden;
  min-width: 48px;
}
.prog-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  transition: width .4s ease;
}
.prog-pct { font-size: 12px; color: #60a5fa; white-space: nowrap; font-weight: 600; }

/* ── GitHub badges ────────────────────────────────── */
.gh-badges { margin-left: 6px; white-space: nowrap; }

.gh-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 999px;
  text-decoration: none;
  border: 1px solid transparent;
  margin-left: 3px;
  vertical-align: middle;
}
.gh-badge:hover { opacity: .8; }

.gh-pr    { background: rgba(59,130,246,.15); color: #60a5fa; border-color: rgba(59,130,246,.3); }
.gh-issue { background: rgba(251,191,36,.12);  color: #fbbf24; border-color: rgba(251,191,36,.3); }
.gh-clean { background: rgba(74,222,128,.1);   color: #4ade80; border-color: rgba(74,222,128,.25); }
.li-badge { background: rgba(10,102,194,.18);  color: #5badec; border-color: rgba(10,102,194,.4); font-weight: 700; letter-spacing: .03em; }

/* ── Description / current task ──────────────────── */
.desc { color: #94a3b8; }
.current-task { color: #cbd5e1; }

.missing {
  margin-top: 6px;
  color: #fbbf24;
  background: rgba(251,191,36,.07);
  border: 1px dashed rgba(251,191,36,.3);
  padding: 6px 10px;
  border-radius: 8px;
}

/* ── Row expand ───────────────────────────────────── */
.proj-row { cursor: pointer; transition: background .15s; }
.proj-row:hover td { background: rgba(96,165,250,.05); }
.expand-icon { color: #475569; margin-right: 4px; }

/* ── Epic detail panel ────────────────────────────── */
.epic-detail td {
  background: #0f172a;
  padding: 16px 20px !important;
  border-bottom: 1px solid #334155;
}

.epic-list { display: flex; flex-wrap: wrap; gap: 12px; }

.epic {
  flex: 1;
  min-width: 200px;
  background: #1e293b;
  border-radius: 10px;
  border: 1px solid #334155;
  overflow: hidden;
}
.epic.status-ok      { border-left: 3px solid #4ade80; }
.epic.status-warn    { border-left: 3px solid #fbbf24; }
.epic.status-blocked { border-left: 3px solid #f87171; }

.epic-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  background: #0f172a;
  border-bottom: 1px solid #334155;
}
.epic-hdr:hover { background: rgba(96,165,250,.06); }

.epic-fold  { color: #475569; flex-shrink: 0; }
.epic-title { font-weight: 600; color: #e2e8f0; flex: 1; }

.epic-tasks { padding: 8px 12px; }

.task         { padding: 2px 0; line-height: 1.5; overflow-wrap: break-word; word-break: break-word; }
.task.done    { color: #4ade80; }
.task.pending { color: #fbbf24; }
.task.blocked { color: #f87171; font-weight: 600; }

/* ── Recent commits ───────────────────────────────── */
.commits-section {
  margin-top: 16px;
  border-top: 1px solid #334155;
  padding-top: 12px;
}

.commits-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 8px;
}

.commit {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(51,65,85,.5);
  line-height: 1.4;
}
.commit:last-child { border-bottom: none; }

.commit-hash {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: #3b82f6;
  flex-shrink: 0;
  letter-spacing: .04em;
}

.commit-date {
  font-size: 12px;
  color: #475569;
  flex-shrink: 0;
  white-space: nowrap;
}

.commit-subject {
  font-size: 13px;
  color: #cbd5e1;
  flex: 1;
  overflow-wrap: anywhere;
}

a.commit-hash {
  color: #3b82f6;
  text-decoration: none;
}
a.commit-hash:hover { text-decoration: underline; color: #60a5fa; }

/* ── Dashboard ────────────────────────────────────── */
.dashboard {
  padding: 12px 24px;
  background: #1e293b;
  border-bottom: 1px solid #334155;
}

.dash-cards {
  display: flex;
  gap: 12px;
  align-items: stretch;
  flex-wrap: wrap;
}

.dash-card {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 10px 16px;
  min-width: 120px;
  flex-shrink: 0;
}

.dash-card-prog  { min-width: 160px; }
.dash-card-wide  { flex: 1; min-width: 240px; }

.dash-val {
  font-size: 22px;
  font-weight: 700;
  color: #f1f5f9;
  line-height: 1.2;
}
.dash-pct  { color: #60a5fa; }
.dash-sub  { font-size: 14px; color: #475569; font-weight: 400; }

.dash-lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #475569;
  margin-top: 4px;
}

.dash-prog { margin-top: 8px; height: 4px; }

.dash-status-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.dash-activity {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.dash-proj {
  font-size: 11px;
  color: #3b82f6;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
}

/* ── GitHub badges (inline in title row) ─────────── */
.gh-badges {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  margin-left: 6px;
  vertical-align: middle;
}

.gh-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid transparent;
  text-decoration: none;
  white-space: nowrap;
}
.gh-badge:hover { opacity: .8; }

.gh-pr    { background: rgba(74,222,128,.1);  color: #4ade80; border-color: rgba(74,222,128,.25); }
.gh-issue { background: rgba(251,191,36,.1);  color: #fbbf24; border-color: rgba(251,191,36,.25); }
.gh-clean { background: rgba(96,165,250,.1);  color: #60a5fa; border-color: rgba(96,165,250,.25); }
.li-badge { background: rgba(10,102,194,.18); color: #5badec; border-color: rgba(10,102,194,.4); font-weight: 700; letter-spacing: .03em; }

/* ── Tab bar ──────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: #1e293b;
  border-bottom: 1px solid #334155;
  padding: 0 24px;
}

.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 10px 16px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  color: #475569;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color .15s;
}
.tab:hover { color: #94a3b8; }
.tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
.tab.active:hover { color: #60a5fa; }

.tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(96,165,250,.15);
  color: #60a5fa;
  border: 1px solid rgba(96,165,250,.3);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
}

/* ── Ideas panel ──────────────────────────────────── */
.ideas-panel {
  padding: 20px 24px 40px;
  max-width: 860px;
}

.ideas-h2 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #60a5fa;
  margin: 24px 0 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #334155;
}

.ideas-h3 {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
  margin: 16px 0 4px;
}

.ideas-hr {
  border: none;
  border-top: 1px solid #1e293b;
  margin: 6px 0;
}

.ideas-p {
  color: #94a3b8;
  margin: 3px 0;
  line-height: 1.6;
}

.ideas-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 10px;
}

.ideas-status-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #475569;
}

.idea-badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid transparent;
}
.idea-active { background: rgba(96,165,250,.12);  color: #60a5fa; border-color: rgba(96,165,250,.3); }
.idea-done   { background: rgba(100,116,139,.1);  color: #64748b; border-color: rgba(100,116,139,.2); }
.idea-other  { background: rgba(251,191,36,.1);   color: #fbbf24; border-color: rgba(251,191,36,.25); }

.ideas-empty {
  color: #475569;
  font-style: italic;
  margin-top: 16px;
}

.ideas-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  background: #0f172a;
  padding: 1px 5px;
  border-radius: 4px;
  color: #93c5fd;
}

/* ── Complexity chips ─────────────────────────────── */
.comp-chips {
  display: inline-flex;
  gap: 4px;
  margin-left: 8px;
  vertical-align: middle;
}

.comp-est {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(251,191,36,.1);
  color: #fbbf24;
  border: 1px solid rgba(251,191,36,.2);
  font-weight: 600;
}

.comp-actual {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(96,165,250,.1);
  color: #60a5fa;
  border: 1px solid rgba(96,165,250,.2);
  font-weight: 600;
}


/* ── Mobile responsiveness ────────────────────────── */
@media (max-width: 640px) {
  .top {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
  }

  .controls {
    flex-wrap: wrap;
    width: 100%;
  }

  .controls input {
    width: 100%;
    flex: 1 1 100%;
  }

  .controls select,
  .controls button {
    flex: 1;
  }

  .countdown { display: none; }

  /* Root bar is a desktop-only config field */
  .root-bar { display: none; }

  main { padding: 8px 12px; }

  .dashboard { padding: 10px 12px; }

  .dash-cards { gap: 8px; }

  .dash-card { min-width: 100px; padding: 8px 12px; }

  .epic-list { flex-direction: column; }

  .epic { min-width: 0; }

  /* Hide Done, Left, Current Task, Description — keep Project, Status, Progress */
  th:nth-child(3), td:nth-child(3),
  th:nth-child(4), td:nth-child(4),
  th:nth-child(6), td:nth-child(6),
  th:nth-child(7), td:nth-child(7) { display: none; }

  /* Allow table to shrink below 640px on portrait */
  table { min-width: 0; }
}

/* ── Unstructured Projects section ───────────────────────────────────────── */

.unstructured-panel {
  margin: 0 0 0 0;
  border-top: 1px solid var(--border, #2a2f3a);
}

.unstructured-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px 10px;
}

.unstructured-title {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted, #8892a4);
}

.unstructured-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--border, #2a2f3a);
  color: var(--muted, #8892a4);
  font-size: 0.72rem;
  font-weight: 600;
}

.unstructured-table {
  width: 100%;
  font-size: 0.85rem;
}

.unstructured-date {
  color: var(--muted, #8892a4);
  font-size: 0.8rem;
  white-space: nowrap;
}

/* Signal chips */
.sig {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  margin-right: 3px;
}
.sig-git     { background: #1d2d1d; color: #5aad5a; border: 1px solid #2d4a2d; }
.sig-readme  { background: #1d2535; color: #5a8ec4; border: 1px solid #2a3d55; }
.sig-pkg     { background: #2c2010; color: #c49a40; border: 1px solid #4a3a18; }
.sig-none    { color: var(--muted, #8892a4); }

/* Freshness badges */
.freshness-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.fresh-active { background: #1a2e1a; color: #4caf50; border: 1px solid #2d4a2d; }
.fresh-idle   { background: #2c2510; color: #ffa726; border: 1px solid #4a3d18; }
.fresh-stale  { background: #2a1a1a; color: #888; border: 1px solid #3d2a2a; }

  </style>
  <style>
    /* static mode: hide server-dependent controls */
    .root-bar, #refresh, #countdown { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Meridian</h1>
      <div class="meta" id="meta"></div>
    </div>

    <div class="controls">
      <input id="q" placeholder="Search by name / description…" />
      <select id="status">
        <option value="all">All</option>
        <option value="blocked">Blocked</option>
        <option value="needs work">Needs work</option>
        <option value="in progress">In progress</option>
        <option value="complete">Complete</option>
      </select>
      <button id="refresh">Refresh</button>
      <button id="export">Export MD</button>
      <span id="countdown" class="countdown"></span>
    </div>
    <div class="root-bar">
      <label for="root-input">Root</label>
      <input id="root-input" class="root-input" />
      <button id="root-apply">Apply</button>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" id="tab-projects">Projects</button>
    <button class="tab" id="tab-ideas">Ideas <span id="idea-count" class="tab-count" style="display:none"></span></button>
  </nav>

  <div id="dashboard" class="dashboard"></div>

  <main>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th>Status</th>
            <th>Done</th>
            <th>Left</th>
            <th>Progress</th>
            <th>Current Task</th>
            <th>Description / Missing</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <div id="ideas-panel" class="ideas-panel" style="display:none">
    <div id="ideas-content" class="ideas-content">Loading ideas…</div>
  </div>

  <script>
    /* ── Static data shim ──────────────────────────────────
       Intercepts /api/* fetch calls and returns the snapshot

﻿(function () {

  // ── Tab switching ──────────────────────────────────

  var unstructuredVisible = false;

  function switchTab(tab) {
    elTabProjects.classList.toggle("active", tab === "projects");
    elTabIdeas.classList.toggle("active", tab === "ideas");
    elMain.style.display = tab === "projects" ? "" : "none";
    if (elDashboard) elDashboard.style.display = tab === "projects" ? "" : "none";
    if (elUnstructuredPanel) elUnstructuredPanel.style.display = (tab === "projects" && unstructuredVisible) ? "" : "none";
    elIdeasPanel.style.display = tab === "ideas" ? "" : "none";
    if (tab === "ideas") renderIdeasPanel();
  }

  elTabProjects.addEventListener("click", function () { switchTab("projects"); });
  elTabIdeas.addEventListener("click", function () { switchTab("ideas"); });

  // ── Ideas ──────────────────────────────────────────

  var ideasData = null;

  // ── Unstructured projects ──────────────────────────────────────────────────

  var elUnstructuredPanel = document.getElementById("unstructured-panel");
  var elUnstructuredRows  = document.getElementById("unstructured-rows");
  var elUnstructuredCount = document.getElementById("unstructured-count");

  var FRESHNESS_LABEL = { active: "active", idle: "idle", stale: "stale" };
  var FRESHNESS_CLASS = { active: "fresh-active", idle: "fresh-idle", stale: "fresh-stale" };

  function relativeDate(ms) {
    var ageDays = (Date.now() - ms) / (1000 * 60 * 60 * 24);
    if (ageDays < 1)   return "today";
    if (ageDays < 2)   return "yesterday";
    if (ageDays < 30)  return Math.floor(ageDays) + "d ago";
    if (ageDays < 365) return Math.floor(ageDays / 30) + "mo ago";
    return Math.floor(ageDays / 365) + "y ago";
  }

  function renderUnstructured(projects) {
    if (!projects || !projects.length) {
      unstructuredVisible = false;
      if (elUnstructuredPanel) elUnstructuredPanel.style.display = "none";
      return;
    }
    unstructuredVisible = true;
    if (elUnstructuredCount) elUnstructuredCount.textContent = projects.length;
    if (elUnstructuredPanel) elUnstructuredPanel.style.display = "";

    elUnstructuredRows.innerHTML = projects.map(function (p) {
      var signals = [];
      if (p.hasGit)         signals.push("<span class=\"sig sig-git\">git</span>");
      if (p.hasReadme)      signals.push("<span class=\"sig sig-readme\">readme</span>");
      if (p.hasPackageJson) signals.push("<span class=\"sig sig-pkg\">pkg</span>");
      var sigHtml = signals.join(" ") || "<span class=\"sig-none\">—</span>";
      var freshCls = FRESHNESS_CLASS[p.freshnessState] || "fresh-stale";
      var freshLabel = FRESHNESS_LABEL[p.freshnessState] || p.freshnessState;
      return "<tr>" +
        "<td class=\"proj\"><div class=\"title\">" + esc(p.name) + "</div>" +
        "<div class=\"folder\">" + esc(p.path) + "</div></td>" +
        "<td>" + sigHtml + "</td>" +
        "<td class=\"unstructured-date\">" + esc(relativeDate(p.lastModifiedAt)) + "</td>" +
        "<td><span class=\"freshness-badge " + freshCls + "\">" + freshLabel + "</span></td>" +
        "</tr>";
    }).join("");
  }

  function fetchUnstructured() {
    var url = "/api/unstructured" + (customRoot ? "?root=" + encodeURIComponent(customRoot) : "");
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (j) { renderUnstructured(j.projects || []); })
      .catch(function () {
        if (elUnstructuredPanel) elUnstructuredPanel.style.display = "none";
      });
  }

  function fetchIdeas() {
    fetch("/api/ideas")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        ideasData = data;
        if (data.idea_count > 0 && elIdeaCount) {
          elIdeaCount.textContent = data.idea_count;
          elIdeaCount.style.display = "";
        }
      })
      .catch(function () {});
  }

  function inlineMd(raw) {
    return raw
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code class=\"ideas-code\">$1</code>");
  }

  function renderIdeasMd(md) {
    if (!md) return "<p class=\"ideas-empty\">No ideas file found.</p>";
    var lines = md.split(/\r?\n/);
    var out = [];
    lines.forEach(function (line) {
      if (/^# /.test(line)) {
        // skip top-level title (just "Ideas Inbox")
      } else if (/^## /.test(line)) {
        out.push("<h2 class=\"ideas-h2\">" + inlineMd(line.replace(/^## /, "")) + "</h2>");
      } else if (/^### /.test(line)) {
        out.push("<h3 class=\"ideas-h3\">" + inlineMd(line.replace(/^### /, "")) + "</h3>");
      } else if (/^-{3,}$/.test(line.trim())) {
        out.push("<hr class=\"ideas-hr\"/>");
      } else if (/\*\*Status:\*\*/.test(line)) {
        var m = line.match(/\*\*Status:\*\*\s*(.+)/);
        if (m) {
          var val = m[1].trim();
          var cls = /^(done|addressed|complete|retired)/i.test(val) ? "idea-done"
                  : /^idea$/i.test(val) ? "idea-active"
                  : "idea-other";
          out.push("<p class=\"ideas-status\"><span class=\"ideas-status-label\">Status</span><span class=\"idea-badge " + cls + "\">" + inlineMd(val) + "</span></p>");
        }
      } else if (line.trim() === "" || /^_Add new ideas/.test(line)) {
        // skip
      } else {
        out.push("<p class=\"ideas-p\">" + inlineMd(line) + "</p>");
      }
    });
    return out.join("\n");
  }

  function renderIdeasPanel() {
    var el = document.getElementById("ideas-content");
    if (!el) return;
    if (!ideasData) {
      el.innerHTML = "<p class=\"ideas-empty\">Ideas not available.</p>";
      return;
    }
    if (ideasData.error && !ideasData.content) {
      el.innerHTML = "<p class=\"ideas-empty\">Ideas file not available in this environment.</p>";
      return;
    }
    el.innerHTML = renderIdeasMd(ideasData.content);
  }

  // ── Dashboard ─────────────────────────────────────

  function renderDashboard(projects) {

    elDash.innerHTML =
      "<div class=\"dash-cards\">" +
        "<div class=\"dash-card\">" +
          "<div class=\"dash-val\">" + total + "</div>" +
          "<div class=\"dash-lbl\">Projects</div>" +
        "</div>" +
        "<div class=\"dash-card\">" +
          "<div class=\"dash-val\">" + totalDone + "<span class=\"dash-sub\">/" + totalTasks + "</span></div>" +
          "<div class=\"dash-lbl\">Tasks done</div>" +
        "</div>" +
        "<div class=\"dash-card dash-card-prog\">" +
          "<div class=\"dash-val dash-pct\">" + pct + "%</div>" +
          "<div class=\"dash-lbl\">Overall progress</div>" +
          "<div class=\"prog-bar dash-prog\"><div class=\"prog-fill\" style=\"width:" + pct + "%\"></div></div>" +
        "</div>" +
        "<div class=\"dash-card\">" +
          "<div class=\"dash-status-row\">" +
            "<span class=\"badge blocked\">" + blocked    + " blocked</span>" +
            "<span class=\"badge warn\">"    + needsWork  + " needs work</span>" +
            "<span class=\"badge info\">"    + inProgress + " in progress</span>" +
            "<span class=\"badge ok\">"      + complete   + " complete</span>" +
          "</div>" +
          "<div class=\"dash-lbl\">By status</div>" +
        "</div>" +
        (latest
          ? "<div class=\"dash-card dash-card-wide\">" +
              "<div class=\"dash-lbl\">Latest activity</div>" +
              "<div class=\"dash-activity\">" +
                "<span class=\"commit-hash\">" + esc(latest.hash)    + "</span>" +
                "<span class=\"commit-date\">" + esc(latest.date)    + "</span>" +
                "<span class=\"commit-subject\">" + esc(latest.subject) + "</span>" +
                "<span class=\"dash-proj\">"   + esc(latest.project) + "</span>" +
              "</div>" +
            "</div>"
          : "") +
      "</div>";
  }

  // ── Commits ───────────────────────────────────────

  function renderCommits(commits, githubRepo) {
    if (!commits || !commits.length) return "";
    var baseUrl = githubRepo
      ? "https://github.com/" + esc(githubRepo.owner) + "/" + esc(githubRepo.repo) + "/commit/"
      : null;
    var rows = commits.map(function (c) {
      var hashEl = baseUrl
        ? "<a class=\"commit-hash\" href=\"" + baseUrl + esc(c.hash) + "\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\">" + esc(c.hash) + "</a>"
        : "<span class=\"commit-hash\">" + esc(c.hash) + "</span>";
      return "<div class=\"commit\">" +
        hashEl +
        "<span class=\"commit-date\">" + esc(c.date) + "</span>" +
        "<span class=\"commit-subject\">" + esc(c.subject) + "</span>" +
      "</div>";
    }).join("");
    return "<div class=\"commits-section\">" +
      "<div class=\"commits-title\">Recent commits</div>" +
      rows +
    "</div>";
  }

  function renderEpics(epics, rowIdx) {
    if (!epics || !epics.length) return "";
    return epics.map(function (ep, ei) {
      var doneCnt = ep.tasks.filter(function (t) { return t.status === "done"; }).length;
      var total = ep.tasks.length;
      var cls = epicBadgeClass(ep.tasks);
      var tasksId = "etasks-" + rowIdx + "-" + ei;
      var tasks = ep.tasks.map(function (t) {
        var st = t.status || "pending";
        var estHtml   = t.estimate ? "<span class=\"comp-est\">"    + esc(t.estimate) + "</span>" : "";
        var actHtml   = t.actual   ? "<span class=\"comp-actual\">→ " + esc(t.actual)   + "</span>" : "";
        var chipsHtml = (estHtml || actHtml) ? "<span class=\"comp-chips\">" + estHtml + actHtml + "</span>" : "";
        return "<div class=\"task " + st + "\">" +
          (TASK_ICON[st] || "○") + " " + esc(t.text) + chipsHtml +
        "</div>";
      }).join("");
      return "<div class=\"epic status-" + cls + "\">" +
        "<div class=\"epic-hdr\" data-tasks-id=\"" + tasksId + "\">" +
          "<span class=\"epic-fold\">▼</span>" +
          "<span class=\"epic-title\">" + esc(ep.title) + "</span>" +
          (total ? "<span class=\"badge " + cls + "\">" + doneCnt + "/" + total + "</span>" : "") +
        "</div>" +
        "<div class=\"epic-tasks\" id=\"" + tasksId + "\">" +
          tasks +
        "</div>" +
      "</div>";
    }).join("");
  }

  function ghBadgesHtml(stats) {
    var parts = [];
    if (stats.open_prs > 0) {
      parts.push("<a class=\"gh-badge gh-pr\" href=\"" + esc(stats.html_url) + "/pulls\" target=\"_blank\" rel=\"noopener\">" +
        "⬆ " + stats.open_prs + " PR" + (stats.open_prs !== 1 ? "s" : "") + "</a>");
    }
    if (stats.open_issues > 0) {
      parts.push("<a class=\"gh-badge gh-issue\" href=\"" + esc(stats.html_url) + "/issues\" target=\"_blank\" rel=\"noopener\">" +
        "⚠ " + stats.open_issues + "</a>");
    }
    if (!parts.length) {
      return "<a class=\"gh-badge gh-clean\" href=\"" + esc(stats.html_url) + "\" target=\"_blank\" rel=\"noopener\">GH ✓</a>";
    }
    return parts.join(" ");
  }

  function fetchGhStats(projects) {
    projects.forEach(function (p) {
      if (!p.github_repo) return;
      var key = p.github_repo.owner + "/" + p.github_repo.repo;
      var elId = "gh-" + p.github_repo.owner + "-" + p.github_repo.repo;
      var el = document.getElementById(elId);

      if (ghCache[key] && ghCache[key] !== "loading") {
        if (el) el.innerHTML = ghBadgesHtml(ghCache[key]);
        return;
      }
      if (ghCache[key] === "loading") return;

      ghCache[key] = "loading";
      fetch("/api/github-stats?owner=" + encodeURIComponent(p.github_repo.owner) +
            "&repo=" + encodeURIComponent(p.github_repo.repo))
        .then(function (r) { return r.json(); })
        .then(function (stats) {
          if (stats.error) {
            ghCache[key] = null;
            if (el) el.innerHTML = "";
            return;
          }
          ghCache[key] = stats;
          var el2 = document.getElementById(elId);
          if (el2) el2.innerHTML = ghBadgesHtml(stats);
        })
        .catch(function () {
          ghCache[key] = null;
          var el2 = document.getElementById(elId);
          if (el2) el2.innerHTML = "";
        });
    });
  }

  function render() {
    renderDashboard(all);
    var q = (elQ.value || "").trim().toLowerCase();
    var st = elStatus.value || "all";

    var filtered = all.filter(function (p) {
      var title = (p && p.title) ? p.title : "";
      var desc = (p && p.description) ? p.description : "";
      var hay = (title + " " + desc).toLowerCase();
      var okQ = (!q) || (hay.indexOf(q) !== -1);
      var okSt = (st === "all") || (p.status === st);
      return okQ && okSt;
    });

    elRows.innerHTML = filtered.map(function (p, i) {
      var m = p.metrics || {};
      var done = (m.done !== null && m.done !== undefined) ? m.done : "";
      var left = (m.left !== null && m.left !== undefined) ? m.left : "";
      var prog = (m.progress_percent !== null && m.progress_percent !== undefined) ? m.progress_percent : "";
      var progHtml = (prog !== "")
        ? "<div class=\"prog-wrap\"><div class=\"prog-bar\"><div class=\"prog-fill\" style=\"width:" + prog + "%\"></div></div><span class=\"prog-pct\">" + prog + "%</span></div>"
        : "";

      var missingArr = p.missing_files || [];
      var missing = missingArr.map(esc).join("<br/>");

      var epicHtml = renderEpics(p.epics, i);
      var commitsHtml = renderCommits(p.recent_commits, p.github_repo);
      var rowId = "erow-" + i;

      var folderKey = (p.folder || "").replace(/\\/g, "/").split("/").filter(Boolean).pop() || "";
      var extraLinks = (PROJECT_LINKS[folderKey] || []).map(function (lk) {
        return "<a class=\"gh-badge " + esc(lk.cls) + "\" href=\"" + esc(lk.url) + "\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\">" + esc(lk.label) + "</a>";
      }).join("");

      return (
        "<tr class=\"proj-row\" data-epic-target=\"" + rowId + "\">" +
          "<td class=\"proj\">" +
            "<div class=\"title\">" +
              ((epicHtml || commitsHtml) ? "<span class=\"expand-icon\">▶</span> " : "") +
              esc(p.title) +
              (p.github_repo ? " <span class=\"gh-badges\" id=\"gh-" + esc(p.github_repo.owner) + "-" + esc(p.github_repo.repo) + "\">…</span>" : "") +
              (extraLinks ? " " + extraLinks : "") +
            "</div>" +
            "<div class=\"folder\">" + esc(p.folder) + "</div>" +
          "</td>" +
          "<td><span class=\"badge " + (p.status === "complete" ? "ok" : p.status === "blocked" ? "blocked" : p.status === "in progress" ? "info" : "warn") + "\">" + esc(p.status) + "</span></td>" +
          "<td class=\"num\">" + done + "</td>" +
          "<td class=\"num\">" + left + "</td>" +
          "<td>" + progHtml + "</td>" +
          "<td class=\"current-task\">" + esc(p.current_task) + "</td>" +
          "<td>" +
            "<div class=\"desc\">" + esc(p.description) + "</div>" +
            (missing ? ("<div class=\"missing\"><b>Missing:</b><br/>" + missing + "</div>") : "") +
          "</td>" +
        "</tr>" +
        ((epicHtml || commitsHtml) ?
          "<tr id=\"" + rowId + "\" class=\"epic-detail\" style=\"display:none\">" +
            "<td colspan=\"7\">" +
              (epicHtml ? "<div class=\"epic-list\">" + epicHtml + "</div>" : "") +
              commitsHtml +
            "</td>" +
          "</tr>"
        : "")
      );
    }).join("");

    fetchGhStats(filtered);

    Array.from(elRows.querySelectorAll(".proj-row")).forEach(function (row) {
      row.addEventListener("click", function () {
        var target = document.getElementById(row.dataset.epicTarget);
        if (!target) return;
        var open = target.style.display !== "none";
        target.style.display = open ? "none" : "";
        var icon = row.querySelector(".expand-icon");
        if (icon) icon.textContent = open ? "▶" : "▼";
      });
    });

    Array.from(elRows.querySelectorAll(".epic-hdr")).forEach(function (hdr) {
      hdr.addEventListener("click", function (e) {
        e.stopPropagation();
        var tasksEl = document.getElementById(hdr.dataset.tasksId);
        if (!tasksEl) return;
        var collapsed = tasksEl.style.display === "none";
        tasksEl.style.display = collapsed ? "" : "none";
        var icon = hdr.querySelector(".epic-fold");
        if (icon) icon.textContent = collapsed ? "▼" : "▶";
      });
    });
  }

  function load() {
    elMeta.textContent = "Scanning…";
    elCountdown.textContent = "";
    var url = "/api/projects" + (customRoot ? "?root=" + encodeURIComponent(customRoot) : "");
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        all = j.projects || [];
        ghCache = {};  // clear on full reload
        var scanned = new Date(j.scanned_at);
        elMeta.textContent =
          "Root: " + j.root +
          " | Projects: " + all.length +
          " | Last scan: " + scanned.toLocaleString();
        render();
        fetchUnstructured();
        startCountdown();
      })
      .catch(function (e) {
        elMeta.textContent = "Load error: " + String(e);
        startCountdown();
      });
  }

  var elExport = document.getElementById("export");

  var STATUS_ICON = { complete: "✓", blocked: "✗", "needs work": "~", "in progress": "→" };
  var TASK_ICON_MD = { done: "✓", blocked: "✗", pending: "○" };

  function exportMarkdown() {
    var lines = [];
    var now = new Date();
    lines.push("# Project Summary");
    lines.push("");
    lines.push("_Exported: " + now.toLocaleString() + "_");
    if (all.length) {
      var meta = document.getElementById("meta").textContent;
      var rootMatch = meta.match(/Root:\s*([^\|]+)/);
      if (rootMatch) lines.push("_Root: " + rootMatch[1].trim() + "_");
    }
    lines.push("");
    lines.push("---");

    all.forEach(function (p) {
      var m = p.metrics || {};
      var icon = STATUS_ICON[p.status] || "~";
      lines.push("");
      lines.push("## " + icon + " " + p.title);
      var statusLine = "**Status:** " + p.status;
      if (m.progress_percent != null) {
        statusLine += " | **Progress:** " + m.progress_percent + "% (" + m.done + "/" + (m.done + m.left) + " done)";
      }
      lines.push(statusLine);
      if (p.current_task) lines.push("**Current task:** " + p.current_task);
      if (p.description) lines.push("**Description:** " + p.description);

      if (p.epics && p.epics.length) {
        lines.push("");
        p.epics.forEach(function (ep) {
          var done = ep.tasks.filter(function (t) { return t.status === "done"; }).length;
          lines.push("### " + ep.title + " (" + done + "/" + ep.tasks.length + ")");
          ep.tasks.forEach(function (t) {
            lines.push("- " + (TASK_ICON_MD[t.status] || "○") + " " + t.text);
          });
        });
      }

      if (p.recent_commits && p.recent_commits.length) {
        lines.push("");
        lines.push("### Recent commits");
        p.recent_commits.slice(0, 5).forEach(function (c) {
          lines.push("- `" + c.hash + "` " + c.date + " — " + c.subject);
        });
      }
    });

    var md = lines.join("\n");
    var blob = new Blob([md], { type: "text/markdown" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "projects-" + now.toISOString().slice(0, 10) + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  elQ.addEventListener("input", render);
  elStatus.addEventListener("change", render);
  elRefresh.addEventListener("click", function () {
    load();
  });
  elExport.addEventListener("click", exportMarkdown);

  elRootApply.addEventListener("click", function () {
    customRoot = elRootInput.value.trim();
    if (customRoot) {
      localStorage.setItem(STORAGE_KEY, customRoot);
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
    load();
  });
  elRootInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") elRootApply.click();
  });

  load();
  fetchIdeas();
})();

  </script>
</body>
